<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Überblick für Eltern: Medienkompetenz für Grundschulkinder.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <title>Medienkompetenz für Grundschulkinder</title>
  <style>
    :root {
      --bg: #fbf8f4;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #6b665f;
      --blue: #2f5d8a;
      --orange: #f08a3e;
      --border: #e8e2da;
      --shadow: rgba(47, 93, 138, 0.12);
      --verlauf: linear-gradient(135deg, rgba(47,93,138,0.10), rgba(240,138,62,0.16));
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #171b20;
        --card: #1f252c;
        --text: #ebe7e1;
        --muted: #a8a196;
        --blue: #7fb0dd;
        --orange: #f5a463;
        --border: #2f3740;
        --shadow: rgba(0, 0, 0, 0.35);
        --verlauf: linear-gradient(135deg, rgba(127,176,221,0.14), rgba(245,164,99,0.18));
      }
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main { max-width: 640px; margin: 0 auto; padding: 28px 18px 64px; }
    [hidden] { display: none !important; }
    .sr-only {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0;
    }

    .version2 {
      display: inline-block;
      margin-bottom: 14px;
      padding: 6px 12px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--orange);
      border: 1px solid var(--orange);
      border-radius: 999px;
      text-decoration: none;
    }
    .version2:hover, .version2:focus-visible { background: var(--orange); color: #fff; outline: none; }

    /* Kopfbereich mit Verlauf */
    .hero {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 22px;
      background: var(--verlauf), var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 4px 18px var(--shadow);
    }
    .hero img { width: 84px; height: 84px; flex: none; }
    .hero h1 { font-size: 1.35rem; line-height: 1.25; margin: 0; color: var(--blue); }

    .bio {
      margin-top: 16px;
      padding: 16px 20px;
      background: var(--card);
      border-radius: 14px;
      border-left: 4px solid var(--orange);
      box-shadow: 0 2px 10px var(--shadow);
    }
    .bio p { margin: 0; }

    /* Fakten-Ticker */
    .fakten {
      touch-action: pan-y;
      user-select: none;
      cursor: grab;
      margin-top: 22px;
      padding: 18px 20px;
      background: var(--blue);
      color: #fff;
      border-radius: 14px;
      box-shadow: 0 4px 14px var(--shadow);
    }
    .fakten:focus-visible { outline: 2px solid var(--orange); outline-offset: 3px; }
    .fakten-kopf {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      opacity: 0.9;
      margin-bottom: 8px;
    }
    .fakten-kopf button {
      font: inherit;
      font-size: 0.78rem;
      color: #fff;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.6);
      border-radius: 999px;
      padding: 4px 10px;
      cursor: pointer;
    }
    .fakten-kopf button:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
    .fakt-text { margin: 0; font-size: 1.05rem; font-weight: 600; min-height: 4.6em; }
    .fakt-quelle { margin: 10px 0 0; font-size: 0.82rem; opacity: 0.9; }
    .fakt-quelle a { color: #fff; text-decoration: underline; }
    .fakt-punkte { display: flex; gap: 6px; margin-top: 12px; }
    .fakt-punkte span { width: 8px; height: 8px; border-radius: 50%; background: rgba(255,255,255,0.4); }
    .fakt-punkte span.aktiv { background: var(--orange); }

    /* Akkordeon */
    .start { margin-top: 30px; }
    .start h2 { font-size: 0.95rem; margin: 0 0 6px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; }
    .akkordeon { display: grid; gap: 12px; }

    .akk {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      box-shadow: 0 2px 10px var(--shadow);
      overflow: hidden;
      scroll-margin-top: 16px;
    }
    .akk-kopf {
      display: grid;
      grid-template-columns: 40px 1fr 24px;
      align-items: center;
      gap: 12px;
      width: 100%;
      padding: 16px;
      background: none;
      border: 0;
      color: var(--text);
      font: inherit;
      text-align: left;
      cursor: pointer;
    }
    .akk-kopf:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
    .nummer {
      display: grid;
      place-items: center;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: var(--orange);
      color: #fff;
      font-weight: 700;
    }
    .kopf-text strong { display: block; font-size: 1.02rem; color: var(--blue); }
    .kopf-text .untertitel { display: block; font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
    .chevron {
      font-size: 1.5rem;
      line-height: 1;
      color: var(--muted);
      transition: transform 0.2s ease;
    }
    .akk.offen .chevron { transform: rotate(90deg); }

    .akk-inhalt { padding: 0 16px 16px; }
    .einleitung { margin: 0 0 6px; font-size: 0.93rem; color: var(--muted); }

    a.card {
      display: grid;
      grid-template-columns: 36px 1fr;
      gap: 12px;
      align-items: start;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 14px;
      margin-top: 10px;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 16px var(--shadow); outline: none; }
    a.card .symbol { font-size: 1.5rem; line-height: 1.2; }
    a.card strong { display: block; font-size: 0.98rem; }
    a.card .beschr { display: block; font-size: 0.88rem; color: var(--muted); margin-top: 3px; }
    a.card .region { display: inline-block; font-size: 0.75rem; color: var(--muted); margin-top: 4px; }

    /* Externer Navigationspunkt */
    a.extern {
      display: block;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      text-decoration: none;
      color: var(--text);
      box-shadow: 0 2px 10px var(--shadow);
    }
    a.extern strong { display: block; color: var(--blue); }
    a.extern span { display: block; font-size: 0.88rem; color: var(--muted); margin-top: 2px; }
    a.extern:hover, a.extern:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

    /* Video */
    section.video { margin-top: 36px; }
    section.video h2 { font-size: 1.15rem; margin: 0; color: var(--blue); }
    .video-rahmen {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .video-rahmen iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    footer {
      margin-top: 52px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    footer a { color: var(--muted); }
    #fehler { color: #b3261e; display: none; }
    @media (prefers-reduced-motion: reduce) {
      html { scroll-behavior: auto; }
      a.card, .chevron { transition: none; }
    }
  </style>
</head>
<body>
<main>
  <a class="version2" id="version2" href="#" hidden></a>

  <header class="hero">
    <img src="logo.svg" alt="Logo Medienkompetenz für Grundschulkinder">
    <h1 id="titel">Medienkompetenz für Grundschulkinder</h1>
  </header>

  <div class="bio" id="bio"></div>

  <section class="fakten" id="fakten-box" aria-labelledby="fakten-kopf-titel" tabindex="0" hidden>
    <div class="fakten-kopf">
      <span id="fakten-kopf-titel">Wussten Sie schon?</span>
      <button type="button" id="fakten-weiter">Nächster Fakt</button>
    </div>
    <p class="fakt-text" id="fakt-text" aria-live="polite"></p>
    <p class="fakt-quelle" id="fakt-quelle"></p>
    <div class="fakt-punkte" id="fakt-punkte" aria-hidden="true"></div>
  </section>

  <nav class="start" aria-labelledby="start-titel">
    <h2 id="start-titel">Was möchten Sie wissen?</h2>
    <div class="akkordeon" id="akkordeon"></div>
  </nav>

  <div id="fehler">Die Inhalte konnten nicht geladen werden. Bitte später erneut versuchen.</div>

  <section class="video" id="video" hidden>
    <h2 id="video-titel">Video-Tipp für Eltern</h2>
    <div class="video-rahmen" id="video-rahmen"></div>
  </section>

  <footer>
    <p>Zuletzt aktualisiert: <span id="stand"></span></p>
    <p id="kontakt"></p>
    <p id="impressum"></p>
  </footer>
</main>

<script>
  // Alle Inhalte stehen in links.json. Änderungen dort erscheinen nach dem Speichern automatisch.
  const FORMAT = {
    text:     { symbol: '📄', label: 'Text' },
    video:    { symbol: '▶️', label: 'Video' },
    audio:    { symbol: '🎧', label: 'Audio' },
    pdf:      { symbol: '📋', label: 'PDF' },
    buch:     { symbol: '📖', label: 'Buch' },
    tool:     { symbol: '🧭', label: 'Tool' },
    beratung: { symbol: '💬', label: 'Beratung' }
  };
  const FAKT_INTERVALL_MS = 7000;

  function el(tag, attrs = {}, text = '') {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text) node.textContent = text;
    return node;
  }

  // Fakten-Ticker: wechselt nach FAKT_INTERVALL_MS, pausiert bei Maus/Fokus,
  // lässt sich per Button, Wischen (Maus oder Touch) und Pfeiltasten weiterschalten.
  function starteFakten(fakten) {
    const box = document.getElementById('fakten-box');
    if (!fakten || fakten.length === 0) return;
    box.hidden = false;

    const textEl = document.getElementById('fakt-text');
    const quelleEl = document.getElementById('fakt-quelle');
    const punkteEl = document.getElementById('fakt-punkte');
    const n = fakten.length;
    let index = 0;
    let pausiert = false;
    let timer = null;

    fakten.forEach(() => punkteEl.appendChild(el('span')));

    function zeige(i) {
      index = i;
      const f = fakten[index];
      textEl.textContent = f.text;
      quelleEl.textContent = 'Quelle: ';
      quelleEl.appendChild(el('a', { href: f.url, target: '_blank', rel: 'noopener noreferrer' }, f.quelle));
      [...punkteEl.children].forEach((p, k) => p.classList.toggle('aktiv', k === index));
    }

    function starteTimer() {
      clearInterval(timer);
      if (n > 1) {
        timer = setInterval(() => {
          if (!pausiert) zeige((index + 1) % n);
        }, FAKT_INTERVALL_MS);
      }
    }

    function weiter(richtung) {
      zeige((index + richtung + n) % n);
      starteTimer();
    }

    document.getElementById('fakten-weiter').addEventListener('click', () => weiter(1));

    let startX = null;
    box.addEventListener('pointerdown', e => { startX = e.clientX; });
    box.addEventListener('pointerup', e => {
      if (startX === null) return;
      const dx = e.clientX - startX;
      startX = null;
      if (Math.abs(dx) > 40) weiter(dx < 0 ? 1 : -1);
    });
    box.addEventListener('pointercancel', () => { startX = null; });

    box.addEventListener('keydown', e => {
      if (e.key === 'ArrowRight') weiter(1);
      if (e.key === 'ArrowLeft') weiter(-1);
    });

    box.addEventListener('mouseenter', () => pausiert = true);
    box.addEventListener('mouseleave', () => pausiert = false);
    box.addEventListener('focusin', () => pausiert = true);
    box.addEventListener('focusout', () => pausiert = false);

    zeige(0);
    starteTimer();
  }

  // Eine Karte für einen Link mit Symbol für das Format
  function karte(link) {
    const f = FORMAT[link.format] || { symbol: '🔗', label: link.format || 'Link' };
    const a = el('a', { class: 'card', href: link.url, target: '_blank', rel: 'noopener noreferrer' });
    a.dataset.alter = (link.alter || ['alle']).join(' ');
    a.appendChild(el('span', { class: 'symbol', 'aria-hidden': 'true', title: f.label }, f.symbol));
    const text = el('span');
    text.appendChild(el('span', { class: 'sr-only' }, f.label + ': '));
    text.appendChild(el('strong', {}, link.titel));
    if (link.beschreibung) text.appendChild(el('span', { class: 'beschr' }, link.beschreibung));
    if (link.region && link.region !== 'bundesweit') text.appendChild(el('span', { class: 'region' }, 'Nur ' + link.region));
    a.appendChild(text);
    return a;
  }

  function aufbauen(daten) {
    document.getElementById('titel').textContent = daten.profil.titel;
    document.title = daten.profil.titel;

    const bio = document.getElementById('bio');
    daten.profil.bio.forEach(absatz => bio.appendChild(el('p', {}, absatz)));

    if (daten.profil.version2_url) {
      const v2 = document.getElementById('version2');
      v2.href = daten.profil.version2_url;
      v2.textContent = daten.profil.version2_titel || 'Zurück';
      v2.hidden = false;
    }

    starteFakten(daten.fakten);

    // Akkordeon: die Navigation bestimmt Titel und Reihenfolge, die Schritte liefern den Inhalt.
    const container = document.getElementById('akkordeon');
    const schritteById = {};
    daten.schritte.forEach(s => { schritteById[s.id] = s; });

    const kacheln = {};
    daten.navigation.forEach((punkt, idx) => {
      // Externer Eintrag ohne Schritt: einfacher Link
      if (punkt.url && !punkt.schritt) {
        const a = el('a', { class: 'extern', href: punkt.url, target: '_blank', rel: 'noopener noreferrer' });
        a.appendChild(el('strong', {}, punkt.titel));
        if (punkt.untertitel) a.appendChild(el('span', {}, punkt.untertitel));
        container.appendChild(a);
        return;
      }

      const s = schritteById[punkt.schritt];
      if (!s) return;
      const links = s.links.filter(l => l.url);
      if (links.length === 0) return;

      const item = el('section', { class: 'akk', id: 'schritt-' + s.id });
      const kopf = el('button', {
        type: 'button',
        class: 'akk-kopf',
        id: 'kopf-' + s.id,
        'aria-expanded': 'false',
        'aria-controls': 'inhalt-' + s.id
      });
      kopf.appendChild(el('span', { class: 'nummer', 'aria-hidden': 'true' }, String(idx + 1)));

      const text = el('span', { class: 'kopf-text' });
      text.appendChild(el('strong', {}, punkt.titel));
      if (punkt.untertitel) text.appendChild(el('span', { class: 'untertitel' }, punkt.untertitel));
      kopf.appendChild(text);
      kopf.appendChild(el('span', { class: 'chevron', 'aria-hidden': 'true' }, '›'));

      const inhalt = el('div', {
        class: 'akk-inhalt',
        id: 'inhalt-' + s.id,
        role: 'region',
        'aria-labelledby': 'kopf-' + s.id
      });
      inhalt.hidden = true;
      if (s.einleitung) inhalt.appendChild(el('p', { class: 'einleitung' }, s.einleitung));
      links.forEach(link => inhalt.appendChild(karte(link)));

      item.append(kopf, inhalt);
      container.appendChild(item);
      kacheln[s.id] = { item, kopf, inhalt };

      kopf.addEventListener('click', () => {
        setzeOffen(s.id, inhalt.hidden);
      });
    });

    // Mehrere Kacheln dürfen gleichzeitig offen sein
    function setzeOffen(id, an) {
      const k = kacheln[id];
      if (!k) return;
      k.inhalt.hidden = !an;
      k.kopf.setAttribute('aria-expanded', an ? 'true' : 'false');
      k.item.classList.toggle('offen', an);
    }

    // Direktlink: z. B. …/version2/#informieren öffnet die passende Kachel
    function ausHashOeffnen() {
      const id = decodeURIComponent(location.hash.replace('#', '')).replace(/^schritt-/, '');
      if (kacheln[id]) {
        setzeOffen(id, true);
        kacheln[id].item.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    }
    window.addEventListener('hashchange', ausHashOeffnen);

    // Ohne Direktlink: erste Kachel offen, damit die Seite sofort Inhalt zeigt
    if (location.hash) {
      ausHashOeffnen();
    } else {
      const erste = Object.keys(kacheln)[0];
      if (erste) setzeOffen(erste, true);
    }

    // Video-Tipp: nur anzeigen, wenn eine YouTube-ID eingetragen ist
    if (daten.video && daten.video.embed_id) {
      document.getElementById('video-titel').textContent = daten.video.titel || 'Video-Tipp für Eltern';
      document.getElementById('video-rahmen').appendChild(el('iframe', {
        src: 'https://www.youtube-nocookie.com/embed/' + encodeURIComponent(daten.video.embed_id),
        title: daten.video.titel || 'Video-Tipp für Eltern',
        loading: 'lazy',
        allow: 'accelerometer; clipboard-write; encrypted-media; gyroscope; picture-in-picture',
        allowfullscreen: ''
      }));
      document.getElementById('video').hidden = false;
    }

    // Fußbereich
    document.getElementById('stand').textContent = daten.profil.zuletzt_aktualisiert || '';
    if (daten.profil.kontakt) {
      document.getElementById('kontakt').textContent = 'Kontakt: ' + daten.profil.kontakt;
    }
    if (daten.profil.impressum_url) {
      document.getElementById('impressum').appendChild(el('a', { href: daten.profil.impressum_url }, 'Impressum'));
    }
  }

  fetch('links.json', { cache: 'no-cache' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(aufbauen)
    .catch(() => {
      document.getElementById('fehler').style.display = 'block';
    });
</script>
</body>
</html>
