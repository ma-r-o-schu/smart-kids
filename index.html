<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Infos zur Medienkompetenz für Grundschulkinder: Basiswissen, Entscheidungshilfen und Ratgeber für Eltern.">
  <link rel="icon" href="logo.svg" type="image/svg+xml">
  <title>Medienkompetenz für Grundschulkinder</title>
  <style>
    :root {
      --bg: #fbf8f4;
      --card: #ffffff;
      --text: #2b2b2b;
      --muted: #6b665f;
      --blue: #2f5d8a;
      --orange: #f08a3e;
      --border: #e8e2da;
      --shadow: rgba(47, 93, 138, 0.12);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #171b20;
        --card: #1f252c;
        --text: #ebe7e1;
        --muted: #a8a196;
        --blue: #7fb0dd;
        --orange: #f5a463;
        --border: #2f3740;
        --shadow: rgba(0, 0, 0, 0.35);
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    main { max-width: 640px; margin: 0 auto; padding: 32px 18px 64px; }
    header { display: flex; align-items: center; gap: 16px; }
    header img { width: 72px; height: 72px; flex: none; }
    header h1 { font-size: 1.5rem; line-height: 1.25; margin: 0; color: var(--blue); }
    .bio {
      margin-top: 20px;
      padding: 18px 20px;
      background: var(--card);
      border-radius: 14px;
      border-left: 4px solid var(--orange);
      box-shadow: 0 2px 10px var(--shadow);
    }
    .bio p { margin: 0 0 10px; }
    .bio p:last-child { margin-bottom: 0; }
    section { margin-top: 36px; }
    section h2 { font-size: 1.1rem; margin: 0 0 6px; color: var(--blue); }
    section:nth-of-type(even) h2 { color: var(--orange); }
    section h2::after {
      content: "";
      display: block;
      width: 48px;
      height: 3px;
      margin-top: 6px;
      border-radius: 2px;
      background: var(--orange);
    }
    section:nth-of-type(even) h2::after { background: var(--blue); }
    .hinweis { font-size: 0.92rem; color: var(--muted); margin: 10px 0 0; font-style: italic; }
    a.card {
      display: block;
      background: var(--card);
      border: 1px solid var(--border);
      border-left: 4px solid var(--blue);
      border-radius: 12px;
      padding: 14px 16px;
      margin: 10px 0;
      text-decoration: none;
      color: var(--text);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }
    section:nth-of-type(even) a.card { border-left-color: var(--orange); }
    a.card:hover, a.card:focus-visible { transform: translateY(-2px); box-shadow: 0 6px 16px var(--shadow); outline: none; }
    a.card strong { display: block; font-size: 1rem; }
    a.card span { display: block; font-size: 0.9rem; color: var(--muted); margin-top: 4px; }
    footer {
      margin-top: 52px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.85rem;
      color: var(--muted);
      text-align: center;
    }
    #fehler { color: #b3261e; display: none; }
    @media (prefers-reduced-motion: reduce) { a.card { transition: none; } }
  </style>
</head>
<body>
<main>
  <header>
    <img src="logo.svg" alt="Logo Medienkompetenz für Grundschulkinder">
    <h1 id="titel">Medienkompetenz für Grundschulkinder</h1>
  </header>

  <div class="bio" id="bio"></div>

  <div id="fehler">Die Links konnten nicht geladen werden. Bitte später erneut versuchen.</div>
  <div id="kategorien"></div>

  <footer>Inhalte werden in der Datei <code>links.json</code> gepflegt.</footer>
</main>

<script>
  // Lädt die Inhalte aus links.json.
  const ziel = document.getElementById('kategorien');

  function el(tag, attrs = {}, text = '') {
    const node = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
    if (text) node.textContent = text;
    return node;
  }

  fetch('links.json', { cache: 'no-cache' })
    .then(r => {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(daten => {
      document.getElementById('titel').textContent = daten.profil.titel;
      document.title = daten.profil.titel;

      const bio = document.getElementById('bio');
      daten.profil.bio.forEach(absatz => bio.appendChild(el('p', {}, absatz)));

      daten.kategorien.forEach(kat => {
        const sec = el('section');
        sec.appendChild(el('h2', {}, kat.titel));
        if (kat.hinweis) sec.appendChild(el('p', { class: 'hinweis' }, kat.hinweis));
        kat.links.forEach(link => {
          const a = el('a', { class: 'card', href: link.url, target: '_blank', rel: 'noopener noreferrer' });
          a.appendChild(el('strong', {}, link.titel));
          if (link.beschreibung) a.appendChild(el('span', {}, link.beschreibung));
          sec.appendChild(a);
        });
        ziel.appendChild(sec);
      });
    })
    .catch(() => {
      document.getElementById('fehler').style.display = 'block';
    });
</script>
</body>
</html>
